# Asistente del Consultorio de Voz: repaso del día por Telegram.
#
# Todos los días a las 07:30 de Argentina despierta el servidor y le pide el
# repaso de los pacientes del día. El servidor lo manda solo si hay turnos,
# una vez por día y solo entre las 6 y las 12 h.
name: Asistente (repaso del día)

on:
  schedule:
    - cron: "30 10 * * *" # 10:30 UTC = 07:30 Argentina
  workflow_dispatch:

permissions: {}

jobs:
  repaso:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND: https://vocalislab.onrender.com
    steps:
      - name: Despertar el servidor
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            "$BACKEND/api/health"

      - name: Pedir el repaso del día
        run: |
          curl --fail --silent --show-error -X POST \
            --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            "$BACKEND/api/asistente/repaso-dia"
