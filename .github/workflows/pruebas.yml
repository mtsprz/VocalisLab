# Pruebas del servidor con la MISMA versión de Python que Render (Dockerfile: 3.10).
#
# Un error que solo aparece en 3.10 (por ejemplo, comillas anidadas en un
# f-string, válidas desde 3.12) hace que Render no pueda arrancar la versión
# nueva y siga sirviendo la vieja sin avisar. Este control lo detecta en cada
# commit y GitHub avisa por mail si falla.
name: Pruebas (Python 3.10, igual que Render)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: server_api/requirements.txt
      - name: Librerías del sistema (las mismas del Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg libpango-1.0-0 \
            libpangoft2-1.0-0 libharfbuzz-subset0 libcairo2 libgdk-pixbuf-2.0-0
      - name: Dependencias
        run: pip install -r server_api/requirements.txt pytest httpx jinja2
      - name: El servidor arranca
        working-directory: server_api
        env:
          SESSION_SECRET: prueba
        run: python -c "import index; print(len(index.app.routes), 'rutas')"
      - name: Pruebas
        run: python -m pytest tests -q
