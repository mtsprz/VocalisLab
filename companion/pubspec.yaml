name: vocalis_companion
description: "Vocalis Companion — grabación offline-first de sesiones de terapia vocal con análisis de tono local y sincronización TUS."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Audio: stream PCM sin procesamiento (sin AGC/ruido/eco por config)
  record: ^6.1.0
  # Base local (ffi solo en Windows/Linux; en Android/iOS usa sqflite nativo)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  # Red y energía
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  wakelock_plus: ^1.2.0
  workmanager: ^0.9.0
  flutter_foreground_task: ^8.0.0
  # Seguridad
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.0
  # Utilidades
  uuid: ^4.0.0
  crypto: ^3.0.3
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.0

# Instalador Windows (dart run msix:create). Requiere certificado para firmar.
msix_config:
  display_name: Vocalis Companion
  publisher_display_name: Consultorio de Voz
  identity_name: ConsultorioDeVoz.VocalisCompanion
  msix_version: 1.0.0.0
  capabilities: microphone, internetClient
  certificate_path: vocalis.pfx
  certificate_password: CAMBIAR

flutter:
  uses-material-design: true
