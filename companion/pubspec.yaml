name: vocalis_companion
description: "Vocalis Companion — grabación offline-first de sesiones de terapia vocal con análisis de tono local y sincronización TUS."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Audio: stream PCM sin procesamiento (sin AGC/ruido/eco por config)
  record: ^5.0.0
  # Base local (ffi solo en Windows/Linux; en Android/iOS usa sqflite nativo)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  # Red y energía
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  wakelock_plus: ^1.2.0
  workmanager: ^0.5.0
  flutter_foreground_task: ^8.0.0
  # Seguridad
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.0
  encrypt: ^5.0.0
  # Utilidades
  uuid: ^4.0.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
